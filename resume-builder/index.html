<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shatrughna Ambhore | Interactive Software Engineering Resume Builder</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <!-- Top App Navigation Bar -->
  <header class="app-header">
    <div class="brand-logo">
      <div class="brand-icon"><i class="ph ph-file-text"></i></div>
      <span>Tech Resume Studio</span>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="btn-import-json"><i class="ph ph-upload-simple"></i> Import JSON</button>
      <input type="file" id="file-input-json" accept=".json" style="display: none;">
      <button class="btn btn-secondary" id="btn-export-json"><i class="ph ph-download-simple"></i> Export JSON</button>
      <button class="btn btn-secondary" id="btn-export-md"><i class="ph ph-code"></i> Export Markdown</button>
      <button class="btn btn-primary" id="btn-export-pdf"><i class="ph ph-printer"></i> Download / Print PDF</button>
    </div>
  </header>

  <!-- Main Split Layout View -->
  <main class="app-container">

    <!-- Left Editor Pane -->
    <section class="editor-pane">
      <nav class="editor-tabs">
        <button class="tab-btn active" data-tab="personal"><i class="ph ph-user"></i> Profile</button>
        <button class="tab-btn" data-tab="experience"><i class="ph ph-briefcase"></i> Experience</button>
        <button class="tab-btn" data-tab="skills"><i class="ph ph-cpu"></i> Skills</button>
        <button class="tab-btn" data-tab="projects"><i class="ph ph-code"></i> Projects & AI</button>
        <button class="tab-btn" data-tab="ats"><i class="ph ph-chart-line-up"></i> ATS Check</button>
      </nav>

      <div class="tab-content-container">

        <!-- Tab 1: Personal Info -->
        <div class="tab-panel active" id="tab-personal">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="input-fullName">
            </div>
            <div class="form-group">
              <label>Professional Title</label>
              <input type="text" id="input-title">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="input-email">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="text" id="input-phone">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Location / Work Mode</label>
              <input type="text" id="input-location">
            </div>
            <div class="form-group">
              <label>LinkedIn Profile</label>
              <input type="text" id="input-linkedin">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>GitHub Profile</label>
              <input type="text" id="input-github">
            </div>
            <div class="form-group">
              <label>Notice Period</label>
              <input type="text" id="input-noticePeriod">
            </div>
          </div>

          <div class="form-group">
            <label>Target Engineering Roles</label>
            <input type="text" id="input-targetRoles">
          </div>

          <div class="form-group">
            <label>Executive Professional Summary</label>
            <textarea id="input-summary" style="min-height: 120px;"></textarea>
          </div>
        </div>

        <!-- Tab 2: Experience -->
        <div class="tab-panel" id="tab-experience">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="font-size: 1.05rem;">Work History & Accomplishments</h3>
            <button class="btn btn-secondary" id="btn-add-experience"><i class="ph ph-plus"></i> Add Role</button>
          </div>
          <div id="experience-list"></div>
        </div>

        <!-- Tab 3: Technical Skills -->
        <div class="tab-panel" id="tab-skills">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="font-size: 1.05rem;">Technical Skill Categories</h3>
            <button class="btn btn-secondary" id="btn-add-skill"><i class="ph ph-plus"></i> Add Category</button>
          </div>
          <div id="skills-list"></div>
        </div>

        <!-- Tab 4: Projects -->
        <div class="tab-panel" id="tab-projects">
          <h3 style="font-size: 1.05rem; margin-bottom: 16px;">Featured Open Source & AI Engineering Projects</h3>
          <div id="projects-list"></div>
        </div>

        <!-- Tab 5: ATS Score Analyzer -->
        <div class="tab-panel" id="tab-ats">
          <div class="ats-card">
            <div class="ats-score-header">
              <div>
                <h3 style="font-size: 1.2rem;">Real-Time ATS Readiness Score</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Optimized for Enterprise ATS Parsers & Tech Recruiters</p>
              </div>
              <div class="score-badge" id="ats-score-value">0%</div>
            </div>

            <div id="ats-checks-list"></div>
            <div id="ats-suggestions-list" style="margin-top: 16px;"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- Right Live Preview Canvas Pane -->
    <section class="preview-pane">
      <div class="preview-toolbar">
        <div class="toolbar-group">
          <label style="margin: 0; font-size: 0.8rem;">Template:</label>
          <select id="select-template" style="padding: 6px 12px; font-size: 0.85rem; width: 170px;">
            <option value="modern" selected>Modern Tech Executive</option>
            <option value="ats">Classic ATS Standard</option>
            <option value="minimal">Silicon Valley Minimalist</option>
            <option value="creative">Creative Developer</option>
          </select>
        </div>

        <div class="toolbar-group">
          <label style="margin: 0; font-size: 0.8rem;">Accent Color:</label>
          <div style="display: flex; gap: 8px;">
            <div class="color-swatch active" style="background: #6366f1;" data-color="#6366f1"></div>
            <div class="color-swatch" style="background: #10b981;" data-color="#10b981"></div>
            <div class="color-swatch" style="background: #06b6d4;" data-color="#06b6d4"></div>
            <div class="color-swatch" style="background: #e11d48;" data-color="#e11d48"></div>
            <div class="color-swatch" style="background: #f59e0b;" data-color="#f59e0b"></div>
            <div class="color-swatch" style="background: #0f172a;" data-color="#0f172a"></div>
          </div>
        </div>

        <div class="toolbar-group">
          <label style="margin: 0; font-size: 0.8rem;">Size: <span id="val-fontSize">10pt</span></label>
          <input type="range" id="range-fontSize" min="8.5" max="12" step="0.5" value="10" style="width: 70px;">
        </div>

        <div class="toolbar-group">
          <label style="margin: 0; font-size: 0.8rem;">Spacing: <span id="val-lineHeight">1.45</span></label>
          <input type="range" id="range-lineHeight" min="1.2" max="1.8" step="0.05" value="1.45" style="width: 70px;">
        </div>
      </div>

      <div class="canvas-scroll-container">
        <div id="resume-canvas"></div>
      </div>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/ats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
